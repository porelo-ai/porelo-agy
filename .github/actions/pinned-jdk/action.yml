# The GraalVM Porelo's CI machines pin, installed on a GitHub runner and checked against its digest - so a
# job compiles with the JDK the acceptance machines build with, never with whatever release a moving
# name ('25') resolved to that day. The pin is porelo-machines' own, resolved with -Pci-tools, and Porelo's
# Machines workflow moves it once a release is three days old.
#
# Bootstrapped from the runner's own Java 25 (JAVA_HOME_25_X64), which only runs porelo-machines once;
# nothing it compiles is published. Needs the repository checked out.
name: Pinned GraalVM
description: Installs the GraalVM Porelo pins, checked against its digest, as JAVA_HOME for the rest of the job.
runs:
    using: composite
    steps:
        # Without it settings.xml falls back to Central's snapshots, and the forge's own are never built against.
        - name: The forge names its snapshot repository
          shell: bash
          run: |
              set -eu
              server="${GITHUB_SERVER_URL:-}"
              url="${MAVEN_SNAPSHOTS_URL:-}"
              if [ "${server%/}" != https://github.com ] && [ -z "${url//[[:space:]]/}" ]; then
                  echo "::error::vars.MAVEN_SNAPSHOTS_URL is empty on ${server:-this forge}, which must name its snapshot repository"
                  exit 1
              fi

        # What setup-graalvm's 'cache: maven' did.
        - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.m2/repository
              key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
              restore-keys: maven-${{ runner.os }}-

        # The wrapper's Maven, fetched once per pin: without it every job fetches it with one unretried download.
        - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ~/.m2/wrapper
              key: maven-wrapper-${{ runner.os }}-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

        - name: Install the pinned GraalVM
          shell: bash
          run: |
              set -eu
              if [ -z "${JAVA_HOME_25_X64:-}" ]; then
                  echo "::error::this runner has no Java 25 to install the pinned GraalVM with (JAVA_HOME_25_X64)"
                  exit 1
              fi
              export JAVA_HOME="$JAVA_HOME_25_X64"
              # The wrapper checks its Maven against distributionSha256Sum and installs it only whole, so asking again
              # after a failed fetch is a retry; a cached one answers at once.
              for attempt in 1 2 3 4 5; do
                  if ./mvnw -B -q --version >/dev/null; then
                      break
                  fi
                  if [ "$attempt" = 5 ]; then
                      echo "::error::the wrapper could not fetch its Maven in 5 attempts"
                      exit 1
                  fi
                  echo "::warning::the wrapper's Maven did not arrive (attempt $attempt); trying again"
                  sleep $((attempt * 10))
              done
              # MAVEN_ARGS, where the workflow sets it, says -U or -P!standard,!forge,!upstream: the cache above is
              # keyed on pom.xml alone. MAVEN_SNAPSHOTS_URL and MAVEN_UPSTREAM_SNAPSHOTS_URL from the workflow and
              # PORELO_PACKAGES_READ_TOKEN from this step say where snapshots come from.
              ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath -Dmdep.outputFile=target/jdk-cp.txt
              "$JAVA_HOME/bin/java" -cp "$(cat target/jdk-cp.txt)" org.fuin.porelo.machines.Main jdk --github
