name: Build

# Workflows alone build nothing: an action's move is checked by its pull request, and the next push with
# content builds with it.
on:
    push:
        branches: [main]
        tags: ['v*']
        paths-ignore: ['**/*.md', 'mkdocs.yml', 'doc/**', 'issues/**', '.github/**', 'porelo.yml']
    pull_request:
        branches: ['**']
        paths-ignore: ['**/*.md', 'mkdocs.yml', 'doc/**', 'issues/**', '.github/**', 'porelo.yml']
    workflow_dispatch:

env:
    # On a tag -P!standard,!forge,!upstream: no snapshot repository, so a release is built from releases only. The
    # same file runs on GitHub and on the local Forgejo; what differs is only the values of variables and secrets
    # present on both.
    MAVEN_ARGS: ${{ startsWith(github.ref, 'refs/tags/v') && '-P!standard,!forge,!upstream' || '-U' }}
    MAVEN_SNAPSHOTS_URL: ${{ vars.MAVEN_SNAPSHOTS_URL }}
    MAVEN_UPSTREAM_SNAPSHOTS_URL: ${{ vars.MAVEN_UPSTREAM_SNAPSHOTS_URL }}
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build and provider-independent checks
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0
            # Publishing is switched by a variable present on both forges, true where the packages are published and
            # false where they are not; one missing or misspelt would leave them unpublished without a word.
            - name: Whether this forge publishes
              env:
                  PORELO_PUBLISH: ${{ vars.PORELO_PUBLISH }}
              run: |
                  case "$PORELO_PUBLISH" in
                      true | false) echo "PORELO_PUBLISH=$PORELO_PUBLISH" ;;
                      *) echo "::error::vars.PORELO_PUBLISH is '$PORELO_PUBLISH', neither true nor false"; exit 1 ;;
                  esac
            - name: The pinned GraalVM
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              uses: ./.github/actions/pinned-jdk
            - name: Unit tests and document guards
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: ./mvnw -B -s settings.xml verify
            - name: Resolve the shared tooling
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath -Dmdep.outputFile=target/cp.txt
            - name: Shared rules, citations, documentation and workflow pins
              run: |
                  set -eu
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-shared AGENTS.md .editorconfig
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-citations .
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-readmes .
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-doc-site doc mkdocs.yml
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-actions
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-providers .
            # A direct push to main never meets the pull request's check, so the push's own range is read here, by the
            # rule this commit carries. A tag checks the commit it names. A new branch or a branch pushed over has no start
            # this checkout holds, so its range starts at main; main itself cannot be pushed over.
            - name: The pushed commits' messages
              if: github.event_name == 'push'
              env:
                  PUSH_BEFORE: ${{ github.event.before }}
              run: |
                  set -eu
                  case "$PUSH_BEFORE" in
                      '') echo "::error::the push names no commit it started from"; exit 1 ;;
                  esac
                  start=$PUSH_BEFORE
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      start="$GITHUB_SHA~1"
                  elif ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                      if [ "$GITHUB_REF" = refs/heads/main ]; then
                          echo "::error::main moved from $PUSH_BEFORE, a commit this checkout does not hold"
                          exit 1
                      fi
                      start=origin/main
                  fi
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main \
                      check-commits "$start..$GITHUB_SHA"
            # The job's token on GitHub, so its API answers the check; empty elsewhere, since a forge's runner puts
            # its own token into GITHUB_TOKEN for every step, and the check would hand it to GitHub.
            - name: The publisher digest agrees with the pin
              env:
                  GITHUB_TOKEN: ${{ github.server_url == 'https://github.com' && github.token || '' }}
              run: |
                  set -eu
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-pin --pin agy --definition target/classes/agent/agy.yaml
            # What the native build and the package checks run, where the runner's image lacks it: the local Forgejo's
            # image carries no rpm. Installed from the distribution's signed archive by way of the Actions cache.
            - name: The tools the packages are built and read with
              id: tools
              run: |
                  set -euo pipefail
                  missing=()
                  for tool in gcc:gcc rpm:rpm dpkg-deb:dpkg; do
                      command -v "${tool%%:*}" > /dev/null || missing+=("${tool#*:}")
                  done
                  dpkg-query -W -f='${Status}' zlib1g-dev 2> /dev/null | grep -q 'ok installed' || missing+=(zlib1g-dev)
                  echo "missing=${missing[*]}" >> "$GITHUB_OUTPUT"

            - if: steps.tools.outputs.missing != ''
              uses: ./.github/actions/runner-apt
              with:
                  packages: ${{ steps.tools.outputs.missing }}

            - name: Native binary, protocol and packages
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: |
                  ./mvnw -B -s settings.xml -Pnative,dist verify -Dagent.snapshot.run=${{ github.run_number }}
            # For the release job, which runs only where PORELO_PUBLISH is true; the action refuses every server but
            # GitHub's.
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              if: vars.PORELO_PUBLISH == 'true'
              with:
                  name: packages
                  path: |
                      target/*.deb
                      target/*.rpm
                      target/*.cdx.json
                  if-no-files-found: error

            # For this run's acceptance legs on either forge, where they install what this run built: GitHub's artifact
            # actions refuse every other server, the Actions cache answers on both. Keyed by the run, so a leg never
            # installs another run's, and by the attempt, so a full re-run saves what it rebuilt.
            - name: The packages for this run's legs
              if: github.ref_type == 'tag' || vars.PORELO_PUBLISH != 'true'
              run: |
                  mkdir -p candidate
                  cp target/*.deb target/*.rpm target/*.cdx.json candidate/

            - if: github.ref_type == 'tag' || vars.PORELO_PUBLISH != 'true'
              uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: candidate
                  key: candidate-${{ github.run_id }}-${{ github.run_attempt }}

            # Only main and a tag v<version> publish, and a run that publishes nothing says so rather than skipping silently.
            - name: Not publishing
              if: "!(vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))"
              env:
                  EVENT: ${{ github.event_name }}
                  REF: ${{ github.ref }}
              run: |
                  echo "Not publishing. This run is '$EVENT' on '$REF',"
                  echo "and only a push to main or a tag v<version> publishes, on a forge whose PORELO_PUBLISH is true. The packages were built and tested here;"
                  echo "and are kept with this run for its acceptance legs; nothing reached Artifactory, so"
                  echo "'apt' will still offer whatever was published last."

            - name: Which channel
              id: channel
              if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
              run: |
                  set -eu
                  VERSION="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
                  [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  PORELO="$(sed -n 's|^        <porelo.version>\(.*\)</porelo.version>$|\1|p' pom.xml | head -1)"
                  [ -n "$PORELO" ] || { echo "::error::no porelo.version in pom.xml"; exit 1; }
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
                          || { echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION, the version this commit carries"; exit 1; }
                      case "$VERSION" in
                          *-SNAPSHOT) echo "::error::$VERSION is a snapshot; a release carries its own version"; exit 1 ;;
                      esac
                      case "$PORELO" in
                          *-SNAPSHOT) echo "::error::porelo.version $PORELO is a snapshot; a release is built against a released Porelo"; exit 1 ;;
                      esac
                      echo "channel=releases" >> "$GITHUB_OUTPUT"
                  else
                      case "$VERSION" in
                          *-SNAPSHOT) ;;
                          *) echo "::error::$VERSION on a branch would publish a release as a snapshot"; exit 1 ;;
                      esac
                      echo "channel=snapshots" >> "$GITHUB_OUTPUT"
                  fi
                  echo "  $VERSION -> $(tail -1 "$GITHUB_OUTPUT")"

            - name: A release depends only on releases
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
              run: |
                  ./mvnw -B -s settings.xml help:effective-pom -Doutput=target/effective-pom.xml
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-releases target/effective-pom.xml \
                      --requires org.fuin.porelo:porelo-release

            - name: Publish the packages
              if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -eux
                  . .github/scripts/artifactory.sh
                  art_login
                  if [ "$CHANNEL" = releases ]; then
                      curl -sfL --retry 5 --retry-all-errors -o target/released-index "${JF_URL}/artifactory/porelo-dist-deb/dists/releases/main/binary-amd64/Packages" \
                          || { echo "::error::the release index could not be read, so whether this release is published is unknown"; exit 1; }
                      if grep -qF "Filename: pool/main/p/porelo-agent-agy/$(basename target/*.deb)" target/released-index; then
                          echo "::error::this release is published already"; exit 1
                      fi
                  fi
                  for p in target/*.deb; do
                      art_put "$p" "porelo-dist-deb/pool/main/p/porelo-agent-agy/" \
                          "deb.distribution=${CHANNEL};deb.component=main;deb.architecture=amd64"
                  done
                  for p in target/*.rpm; do art_put "$p" "porelo-dist-rpm/${CHANNEL}/"; done
                  art_put "target/porelo-agent-agy.cdx.json" "porelo-dist-deb/pool/main/p/porelo-agent-agy/"
                  art_put "target/porelo-agent-agy.cdx.json" "porelo-dist-rpm/${CHANNEL}/"

            - name: The package is indexed, not merely stored
              if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -eu
                  DEB="$(basename target/*.deb)"
                  tries=0
                  while [ "$tries" -lt 20 ]; do
                      if curl -sfL --retry 5 --retry-all-errors "${JF_URL}/artifactory/porelo-dist-deb/dists/${CHANNEL}/main/binary-amd64/Packages" \
                          | grep -qF "Filename: pool/main/p/porelo-agent-agy/$DEB"; then
                          echo "  OK    the Debian index lists $DEB"
                          exit 0
                      fi
                      tries=$((tries + 1))
                      sleep 6
                  done
                  echo "::error::$DEB never appeared in the index - uploaded but not indexed"
                  exit 1

    proof:
        name: Legs already proven
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        permissions:
            contents: read
            actions: read
        outputs:
            proven: ${{ steps.ask.outputs.proven }}

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: The pinned GraalVM
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              uses: ./.github/actions/pinned-jdk
            - name: Resolve the release tooling
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: |
                  ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
                      -Dmdep.outputFile=target/cp.txt
            - name: Ask for a run that proved this tree
              id: ask
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main proven-legs \
                      --repository "$GITHUB_REPOSITORY" --tree "$(git rev-parse 'HEAD^{tree}')" \
                      --jobs "Acceptance - ubuntu,Acceptance - fedora;Follow Antigravity CLI"

    acceptance:
        name: Acceptance - ${{ matrix.os }}
        runs-on: ubuntu-24.04
        timeout-minutes: 55
        needs: [build, proof]
        # On every forge: GitHub's rents a server, the host's lends a machine of its kind from its pool, told where by
        # the forge.
        if: >-
            !cancelled() && needs.build.result == 'success' && needs.proof.outputs.proven != 'yes'
            && (github.event_name == 'workflow_dispatch'
            || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))

        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                os: [ubuntu, fedora]

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # The same condition as the leg's --candidate. A re-run of the failed legs alone takes the last attempt's
            # entry of this run; none at all fails the leg here rather than letting it install nothing.
            - name: The packages this run built
              if: github.ref_type == 'tag' || vars.PORELO_PUBLISH != 'true'
              uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: candidate
                  key: candidate-${{ github.run_id }}-${{ github.run_attempt }}
                  restore-keys: candidate-${{ github.run_id }}-
                  fail-on-cache-miss: true
            - name: The pinned GraalVM
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              uses: ./.github/actions/pinned-jdk
            - name: Resolve the machine tooling
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: |
                  ./mvnw -B -q -Pci-tools -s settings.xml dependency:build-classpath \
                      -Dmdep.outputFile=target/cp.txt
            - name: Acceptance on ${{ matrix.os }}
              timeout-minutes: 30
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
                  PORELO_MACHINES_API: ${{ secrets.PORELO_MACHINES_API }}
                  PORELO_MACHINES_SSH: ${{ secrets.PORELO_MACHINES_SSH }}
                  # The host's pool's run key; empty on GitHub, where the two above rent a server instead.
                  PORELO_POOL_SSH: ${{ secrets.PORELO_POOL_SSH }}
                  PORELO_PUBLISH: ${{ vars.PORELO_PUBLISH }}
                  PORELO_CI_LEG: acc-${{ matrix.os }}
                  GEMINI_API_KEY: ${{ secrets.GOOGLE_API }}
                  PORELO_E2E_REFUSED_KEY: porelo-acceptance-not-a-key
                  PORELO_E2E_MODEL: gemini-3.6-flash-low
                  OS: ${{ matrix.os }}
              run: |
                  [ -n "${GEMINI_API_KEY:-}" ] || { echo "::error::the secret GOOGLE_API is empty - the credential scenarios would be skipped and the leg would prove less"; exit 1; }
                  PORELO_E2E_EXPECT_CLI="$(sed -n 's:.*<agent.cli.version>\(.*\)</agent.cli.version>.*:\1:p' pom.xml | head -n 1)"
                  [ -n "$PORELO_E2E_EXPECT_CLI" ] || { echo "::error::pom.xml names no agent.cli.version"; exit 1; }
                  export PORELO_E2E_EXPECT_CLI
                  if [ "$GITHUB_REF_TYPE" = tag ] || [ "$PORELO_PUBLISH" != true ]; then FROM="--package porelo-agent-agy --candidate candidate"; else FROM="--package porelo-agent-agy"; fi
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.machines.Main acceptance \
                      --os "$OS" --kind amd64 $FROM \
                      --cucumber .
            - name: Delete what this run created
              if: always()
              env:
                  PORELO_MACHINES_API: ${{ secrets.PORELO_MACHINES_API }}
                  PORELO_CI_LEG: acc-${{ matrix.os }}
              run: java -cp "$(cat target/cp.txt)" org.fuin.porelo.machines.Main sweep --mine

    release:
        name: Publish the release
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        needs: [build, acceptance]
        if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Which channel
              id: channel
              run: |
                  set -eu
                  VERSION="$(sed -n 's|^    <version>\(.*\)</version>$|\1|p' pom.xml | head -1)"
                  [ -n "$VERSION" ] || { echo "::error::no version in pom.xml"; exit 1; }
                  PORELO="$(sed -n 's|^        <porelo.version>\(.*\)</porelo.version>$|\1|p' pom.xml | head -1)"
                  [ -n "$PORELO" ] || { echo "::error::no porelo.version in pom.xml"; exit 1; }
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      [ "$GITHUB_REF_NAME" = "v$VERSION" ] \
                          || { echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION, the version this commit carries"; exit 1; }
                      case "$VERSION" in
                          *-SNAPSHOT) echo "::error::$VERSION is a snapshot; a release carries its own version"; exit 1 ;;
                      esac
                      case "$PORELO" in
                          *-SNAPSHOT) echo "::error::porelo.version $PORELO is a snapshot; a release is built against a released Porelo"; exit 1 ;;
                      esac
                      echo "channel=releases" >> "$GITHUB_OUTPUT"
                  else
                      case "$VERSION" in
                          *-SNAPSHOT) ;;
                          *) echo "::error::$VERSION on a branch would publish a release as a snapshot"; exit 1 ;;
                      esac
                      echo "channel=snapshots" >> "$GITHUB_OUTPUT"
                  fi
                  echo "  $VERSION -> $(tail -1 "$GITHUB_OUTPUT")"

            - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
              with:
                  name: packages
                  path: target

            - name: Publish the packages
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -eux
                  . .github/scripts/artifactory.sh
                  art_login
                  if [ "$CHANNEL" = releases ]; then
                      curl -sfL --retry 5 --retry-all-errors -o target/released-index "${JF_URL}/artifactory/porelo-dist-deb/dists/releases/main/binary-amd64/Packages" \
                          || { echo "::error::the release index could not be read, so whether this release is published is unknown"; exit 1; }
                      if grep -qF "Filename: pool/main/p/porelo-agent-agy/$(basename target/*.deb)" target/released-index; then
                          echo "::error::this release is published already"; exit 1
                      fi
                  fi
                  for p in target/*.deb; do
                      art_put "$p" "porelo-dist-deb/pool/main/p/porelo-agent-agy/" \
                          "deb.distribution=${CHANNEL};deb.component=main;deb.architecture=amd64"
                  done
                  for p in target/*.rpm; do art_put "$p" "porelo-dist-rpm/${CHANNEL}/"; done
                  art_put "target/porelo-agent-agy.cdx.json" "porelo-dist-deb/pool/main/p/porelo-agent-agy/"
                  art_put "target/porelo-agent-agy.cdx.json" "porelo-dist-rpm/${CHANNEL}/"

            - name: The package is indexed, not merely stored
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -eu
                  DEB="$(basename target/*.deb)"
                  tries=0
                  while [ "$tries" -lt 20 ]; do
                      if curl -sfL --retry 5 --retry-all-errors "${JF_URL}/artifactory/porelo-dist-deb/dists/${CHANNEL}/main/binary-amd64/Packages" \
                          | grep -qF "Filename: pool/main/p/porelo-agent-agy/$DEB"; then
                          echo "  OK    the Debian index lists $DEB"
                          exit 0
                      fi
                      tries=$((tries + 1))
                      sleep 6
                  done
                  echo "::error::$DEB never appeared in the index - uploaded but not indexed"
                  exit 1
