name: Build
on:
    push:
        branches: ['**']
        paths-ignore: ['**/*.md', 'mkdocs.yml', 'doc/**', 'issues/**', '.github/**']
    pull_request:
        paths-ignore: ['**/*.md', 'mkdocs.yml', 'doc/**', 'issues/**']
    workflow_dispatch:

env:
    MAVEN_ARGS: -U
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Build and provider-independent checks
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: The pinned GraalVM
              uses: ./.github/actions/pinned-jdk
            - name: Unit tests and document guards
              run: ./mvnw -U -B -s settings.xml verify
            - name: Resolve the shared tooling
              run: ./mvnw -U -B -q -Pci-tools -s settings.xml dependency:build-classpath -Dmdep.outputFile=target/cp.txt
            - name: Shared rules, citations, documentation and workflow pins
              run: |
                  set -eu
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-shared AGENTS.md .editorconfig
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-citations .
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-readmes .
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-doc-site doc mkdocs.yml
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-actions
            - name: The publisher digest agrees with the pin
              run: |
                  set -eu
                  java -cp "$(cat target/cp.txt)" org.fuin.porelo.release.Main check-pin --pin agy --definition target/classes/agent/agy.yaml
            - name: Native binary, protocol and packages
              run: |
                  ./mvnw -U -B -s settings.xml -Pnative,dist verify -Dagent.snapshot.run=${{ github.run_number }}
            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages
                  path: |
                      target/*.deb
                      target/*.rpm
                      target/*.cdx.json
                  if-no-files-found: error
