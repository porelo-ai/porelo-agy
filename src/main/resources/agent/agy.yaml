# Antigravity CLI - https://github.com/google-antigravity/antigravity-cli

name: agy
label: Antigravity CLI
binary: agy

config_dir: "~/.gemini/antigravity-cli"

# What this adapter can hold a task to: off, by a hook AgyContainerSetup writes. No CLI setting counts
# subagents, so Porelo refuses a task allowing more than 0.
subagents: off

login:
    arguments: []
    # Google's hosted callback page shows a code that is pasted at the terminal.
    flow: paste-code

sandboxed:
    arguments: ["--dangerously-skip-permissions"]

git_identity:
    name: Antigravity
    email: noreply@google.com

headless:
    prompt_flag: "-p"
    model_flag: "--model"
    verbose_flag: "--verbose"
    output_format_flags: ["--output-format", "stream-json"]

session:
    supports_resume: true
    resume_flag: "--conversation"
    # How an attended session takes its opening text: behind -i. 'agy --help': "--prompt-interactive  Run an
    # initial prompt interactively and continue the session"; '-p', the headless prompt flag, is print mode.
    # Measured on 1.4.5 in an attended task: it answers the text as its first turn, then rests at its prompt.
    opening_flag: "-i"
    ready_marker: "? for shortcuts"
    ready_within_seconds: 120
    # The composer remains visible during work, while the footer switches from "? for shortcuts" to "esc to cancel".
    at_rest:
        shows: ["? for shortcuts"]
        lacks: ["esc to cancel", "enter Confirm · esc Exit", "enter Select · esc Cancel"]
    waiting:
        screen:
            - contains: "enter Confirm · esc Exit"
              in_last_lines: 5
              for: "workspace trust"
            - contains: "enter Select · esc Cancel"
              in_last_lines: 5
              for: "a selection"
        # 1.4.5 streams each reply in pieces, and a reply's closing piece may be a bare newline;
        # whole text stands for sure only in a successful result, whose response is every reply
        # of the run joined, not the last one alone.
        last_message:
            record: { event: result, result.status: SUCCESS }
            text: result.response
    session_id:
        record: { event: result, result.status: SUCCESS }
        key: result.conversation_id
        directory: ".gemini/antigravity-cli/conversations"
        suffix: ".db"

provider:
    default: google-sign-in
    dialect: google-generative-ai
    endpoint: url
    base_url_env: GOOGLE_GEMINI_BASE_URL
    adds_path: true
    dialects:
        cloud-code:
            base_url_env: CLOUD_CODE_URL
            adds_path: true
    token_env:
        _default: GEMINI_API_KEY
        oauth: GOOGLE_SIGN_IN_TOKEN

refused_domains:
    - antigravity-cli-auto-updater-974169037036.us-central1.run.app
    - play.googleapis.com
    - www.googleapis.com
    - antigravity-unleash.goog

install:
    version: "${agent.cli.version}"
    # Root's, outside the home: fetched and unpacked in the root part of the image, and the wrapper written
    # there too, so what the agent in a task writes never picks what the next start runs, and a self-update
    # fails to write over it.
    artifacts:
        - url: https://github.com/google-antigravity/antigravity-cli/releases/download/${agent.cli.version}/agy_cli_linux_x64.tar.gz
          sha256: "${agent.cli.sha256}"
          license: "SEE LICENSE IN README.md"
          target: /var/cache/porelo/agy/agy.tar.gz
          mode: "0644"
          owner: root
    as_root:
        # umask 022: the agent must read the binary and enter its directory whatever umask the base image sets.
        - >-
          RUN set -eux;
          umask 022;
          staging=$(mktemp -d);
          trap 'rm -rf "$staging"' EXIT;
          test "$(tar -tzf /var/cache/porelo/agy/agy.tar.gz)" = antigravity;
          tar -xzf /var/cache/porelo/agy/agy.tar.gz -C "$staging" --no-same-owner;
          install -D -o root -g root -m 0755 "$staging/antigravity" /usr/local/lib/agy/antigravity;
          printf '%s\n' '#!/bin/sh'
          'set -eu'
          'if [ -z "${CLOUD_CODE_URL:-}" ] && [ -z "${GOOGLE_GEMINI_BASE_URL:-}" ] && [ ! -e /run/porelo ]; then'
          '  umask 077'
          '  mkdir -p /home/agent/.gemini/antigravity-cli'
          '  rm -f /home/agent/.gemini/antigravity-cli/.client-id /home/agent/.gemini/antigravity-cli/.client-secret /home/agent/.gemini/antigravity-cli/.client-ids /home/agent/.gemini/antigravity-cli/.client-secrets'
          '  (set -C; grep -a -o '\''[0-9]\{1,20\}-[0-9a-z]\{16,64\}\.apps\.[g]oogleusercontent\.com'\'' /usr/local/lib/agy/antigravity > /home/agent/.gemini/antigravity-cli/.client-ids)'
          '  (set -C; grep -a -o '\''[G]OCSPX-[A-Za-z0-9_-]\{28\}'\'' /usr/local/lib/agy/antigravity > /home/agent/.gemini/antigravity-cli/.client-secrets)'
          'fi'
          'exec /usr/local/lib/agy/antigravity "$@"'
          > /usr/local/bin/agy;
          chmod 0755 /usr/local/bin/agy;
          rm -r /var/cache/porelo/agy
    as_agent:
        - ENV AGY_CLI_DISABLE_AUTO_UPDATE=true
        - >-
          RUN set -eux;
          mkdir -p /home/agent/.gemini/antigravity-cli/cache;
          chmod 0700 /home/agent/.gemini;
          ln -s /run/porelo/guide/README.md /home/agent/.gemini/GEMINI.md
